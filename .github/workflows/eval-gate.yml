name: eval-gate

# Evalúa el pipeline multiagente contra el golden dataset cuando una PR toca agentes, tools,
# pipeline o el dataset. Aplica umbrales absolutos + regresión frente al baseline de la rama base
# y publica el resultado como comentario de la PR.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/agents/**"
      - "src/pipeline/**"
      - "src/tools/**"
      - "src/schemas/**"
      - "src/llm/**"
      - "data/eval_dataset.jsonl"
      - "data/baseline_pipeline.json"
      - "main.py"
      - "requirements-ci.txt"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:
    inputs:
      versions:
        description: "Opcional: mapa de versiones, p. ej. 'triaje:v4,qa:v3' (vacío = active_versions.yaml)"
        required: false
        default: ""

# Un run por PR: un push nuevo cancela el anterior para no pagar evaluaciones obsoletas.
concurrency:
  group: eval-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Las PRs desde forks no reciben secrets: se omite (el repo es público).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://eu.api.smith.langchain.com' }}
      LANGSMITH_PROJECT: soporte-multiagente-ci
      # Dataset propio de CI, sincronizado desde data/eval_dataset.jsonl del commit evaluado
      # (no toca el dataset "golden" usado en local).
      LANGSMITH_DATASET_NAME: techstore-support-ci
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        # Rápidos y sin llamadas reales al LLM: fallan antes de gastar tokens.
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ci-placeholder

      - name: Baseline de la rama base
        id: baseline
        run: |
          # Se compara contra el baseline de la rama base, no el de la PR, para que una PR
          # no pueda esconder una regresión modificando su propio baseline.
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             git cat-file -e "origin/${{ github.base_ref }}:data/baseline_pipeline.json" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:data/baseline_pipeline.json" > baseline_base.json
            echo "path=baseline_base.json" >> "$GITHUB_OUTPUT"
          elif [ -f data/baseline_pipeline.json ]; then
            echo "path=data/baseline_pipeline.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync CI dataset
        run: python main.py --sync-dataset

      - name: Run evaluation and enforce quality gate
        id: gate
        env:
          VERSIONS_INPUT: ${{ inputs.versions }}
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
          PREFIX_RAW: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('manual-{0}', github.run_id) }}
        run: |
          PREFIX="${PREFIX_RAW:0:40}"
          ARGS=(--eval --langsmith --fail-on-gate --experiment-prefix "$PREFIX" \
                --report-md eval_report.md --report-json eval_report.json)
          if [ -n "$BASELINE_PATH" ]; then
            ARGS+=(--baseline "$BASELINE_PATH")
          fi
          if [ -n "$VERSIONS_INPUT" ]; then
            ARGS+=(--versions "$VERSIONS_INPUT")
          fi
          python main.py "${ARGS[@]}"

      - name: Job summary
        if: always()
        run: |
          if [ -f eval_report.md ]; then cat eval_report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report
          path: |
            eval_report.md
            eval_report.json
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- eval-gate-report -->';
            let body;
            if (fs.existsSync('eval_report.md')) {
              body = fs.readFileSync('eval_report.md', 'utf8');
            } else {
              body = `${marker}\n## ⚠️ Eval Quality Gate — sin informe\n\nEl job terminó antes de generar resultados (error de infraestructura o tests fallidos). Revisa el [log del job](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
