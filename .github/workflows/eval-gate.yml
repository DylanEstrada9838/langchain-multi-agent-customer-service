name: eval-gate

# Valida el informe de evaluación localmente generado (`data/latest_eval_report.json`),
# verifica tests unitarios y publica el reporte como comentario en la Pull Request.
# NO realiza llamadas de inferencia LLM en CI (coste cero, ejecución en segundos).
on:
  pull_request:
    branches: [main]
    paths:
      - "src/agents/**"
      - "src/pipeline/**"
      - "src/tools/**"
      - "src/schemas/**"
      - "src/llm/**"
      - "data/**"
      - "main.py"
      - "requirements-ci.txt"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    name: Quality Gate & PR Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ci-placeholder

      - name: Validate Evaluation Report
        id: validate
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          import yaml

          report_path = Path('data/latest_eval_report.json')
          if not report_path.exists():
              print('::error::No se encontro data/latest_eval_report.json. Ejecuta la evaluacion localmente y haz commit del informe.')
              sys.exit(1)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          active = yaml.safe_load(Path('src/agents/active_versions.yaml').read_text(encoding='utf-8'))

          if report.get('versions') != active:
              print(f'::error::El informe corresponde a versiones {report.get(\"versions\")}, pero active_versions.yaml tiene {active}. Ejecuta la evaluacion localmente con las versiones activas.')
              sys.exit(1)

          if not report.get('passed'):
              print('::error::El informe indica que el Quality Gate NO fue superado (umbrales absolutos o regresion detectada).')
              sys.exit(1)

          print('✅ Informe de evaluacion valido y Quality Gate superado.')
          "

      - name: Job summary
        if: always()
        run: |
          if [ -f data/latest_eval_report.md ]; then
            cat data/latest_eval_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- eval-gate-report -->';
            let body;
            if (fs.existsSync('data/latest_eval_report.md')) {
              body = fs.readFileSync('data/latest_eval_report.md', 'utf8');
            } else {
              body = `${marker}\n## ⚠️ Eval Quality Gate — sin informe\n\nNo se encontró \`data/latest_eval_report.md\`. Ejecuta la evaluación localmente (\`python main.py --eval --langsmith --fail-on-gate\`) y haz commit del informe.\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
