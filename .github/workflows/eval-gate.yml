name: eval-gate

# Valida el informe de evaluación localmente generado (`data/latest_eval_report.json`),
# verifica tests unitarios y publica el reporte como comentario en la Pull Request.
# NO realiza llamadas de inferencia LLM en CI (coste cero, ejecución en segundos).
on:
  pull_request:
    branches: [main]
    paths:
      - "src/agents/**"
      - "src/pipeline/**"
      - "src/tools/**"
      - "src/schemas/**"
      - "src/llm/**"
      - "src/data/**"
      - "src/config.py"
      - "tests/**"
      - "requirements.txt"
      - "data/**"
      - "main.py"
      - "requirements-ci.txt"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    name: Quality Gate & PR Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ci-placeholder

      - name: Validate Evaluation Report
        id: validate
        run: |
          python -c "
          import json
          from pathlib import Path
          from src.pipeline.eval_provenance import validate_full_report
          from src.pipeline.quality_gate import GateReport, render_markdown

          report = json.loads(Path('data/latest_eval_report.json').read_text(encoding='utf-8'))
          validate_full_report(report)
          markdown = Path('data/latest_eval_report.md').read_text(encoding='utf-8')
          if markdown != render_markdown(GateReport.model_validate(report)):
              raise SystemExit('El informe Markdown no corresponde al JSON validado.')
          print('Informe completo, vigente y aprobado.')
          "

      - name: Job summary
        if: always()
        run: |
          if [ -f data/latest_eval_report.md ]; then
            cat data/latest_eval_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- eval-gate-report -->';
            let body;
            if (fs.existsSync('data/latest_eval_report.md')) {
              body = fs.readFileSync('data/latest_eval_report.md', 'utf8');
            } else {
              body = `${marker}\n## ⚠️ Eval Quality Gate — sin informe\n\nNo se encontró \`data/latest_eval_report.md\`. Ejecuta el benchmark LangSmith (\`python main.py --eval --fail-on-gate\`) y haz commit del informe.\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
